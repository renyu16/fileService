<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 文件服务器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container auth-container">
        <div class="auth-card">
            <h1>修改密码</h1>
            <p class="subtitle">请先验证原密码</p>
            <form id="changePwdForm">
                <div class="form-group">
                    <input type="password" id="oldPassword" placeholder="原密码" required>
                </div>
                <div class="form-group">
                    <input type="password" id="newPassword" placeholder="新密码（至少6位）" required>
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" placeholder="确认新密码" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">确认修改</button>
            </form>
            <div id="changePwdMessage" class="message"></div>
            <a href="/" class="back-link">← 返回文件列表</a>
        </div>
    </div>
    <script src="/static/change-password.js"></script>
</body>
</html>
