<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件服务器</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>文件服务器</h1>
            <p class="subtitle">上传、管理和下载文件</p>
        </header>

        <section class="upload-section">
            <h2>上传文件</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" required>
                    <label for="fileInput" class="file-input-label">选择文件</label>
                    <span id="fileName" class="file-name-display">未选择文件</span>
                </div>
                <button type="submit" id="uploadBtn" class="btn btn-primary">上传</button>
            </form>
            <div id="uploadProgress" class="progress-container hidden">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <span id="progressText">0%</span>
            </div>
            <div id="uploadMessage" class="message"></div>
        </section>

        <section class="files-section">
            <h2>文件列表 <button id="refreshBtn" class="btn btn-small">刷新</button></h2>
            <div id="filesList" class="files-list">
                <p class="loading">加载中...</p>
            </div>
        </section>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
